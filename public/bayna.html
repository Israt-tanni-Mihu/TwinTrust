<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>বায়না জমা | জমি যাচাই</title>
<style>
  body { font-family: Arial, sans-serif; background: #f2f6f3; margin: 0; color: #1d2b22; }
  header { background: #0b6b3a; color: #fff; padding: 18px; text-align: center; font-size: 22px; }
  nav { max-width: 640px; margin: 12px auto 0; padding: 0 14px; display: flex; gap: 14px; flex-wrap: wrap; }
  main { max-width: 640px; margin: 14px auto 20px; padding: 0 14px; }
  .box { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  h2 { margin: 0 0 10px; font-size: 18px; }
  .hint { font-size: 14px; color: #556; margin: 0 0 6px; }
  label { display: block; margin: 12px 0 4px; font-weight: bold; }
  input, select, textarea { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #aab; border-radius: 6px; box-sizing: border-box; background: #fff; font-family: inherit; }
  textarea { min-height: 80px; resize: vertical; }
  button { margin-top: 16px; width: 100%; padding: 12px; font-size: 17px; background: #0b6b3a; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  .msg { padding: 8px 10px; border-radius: 4px; margin-bottom: 12px; }
  .err { background: #fdecea; border-left: 4px solid #b00020; color: #b00020; }
  .ok { background: #e8f6ec; border-left: 4px solid #0b6b3a; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 15px; }
  a { color: #0b6b3a; }
</style>
<link rel="stylesheet" href="/site.css">
</head>
<body>
<header>বায়না জমা দিন</header>
<nav>
  <a href="/">জমি খুঁজুন</a>
  <a href="/login.html">← লগইন পেজে ফিরুন</a>
</nav>
<main>
  <div id="message"></div>

  <div class="box" id="formBox">
    <p class="hint">জমির চারটা তথ্য ঠিকমতো দিন। জমা দেওয়ার পর অ্যাডমিন যাচাই করবেন। অনুমোদন না হওয়া পর্যন্ত তথ্যটা সবার কাছে দেখাবে না। টাকার পরিমাণ শুধু অ্যাডমিন দেখতে পাবেন।</p>

    <label for="mouza">১. মৌজা</label>
    <select id="mouza"><option value="">লোড হচ্ছে...</option></select>

    <label for="survey">২. জরিপের ধরন</label>
    <select id="survey">
      <option value="">জরিপ বেছে নিন</option>
      <option value="CS">CS</option>
      <option value="SA">SA</option>
      <option value="RS">RS</option>
      <option value="BS">BS</option>
    </select>

    <label for="dag">৩. দাগ নম্বর</label>
    <input id="dag" placeholder="যেমন D-101">

    <label for="khatian">৪. খতিয়ান নম্বর</label>
    <input id="khatian" placeholder="যেমন K-201">

    <label for="agreement">বায়নানামার নম্বর</label>
    <input id="agreement" maxlength="100" placeholder="যেমন BAYNA-2026/301">

    <label for="seller">বিক্রেতার নাম</label>
    <input id="seller" maxlength="150">

    <label for="amount">বায়নার টাকার পরিমাণ (টাকা)</label>
    <input id="amount" type="number" min="1" step="1" placeholder="যেমন 500000">

    <label for="baynaDate">বায়নার তারিখ</label>
    <input id="baynaDate" type="date">

    <label for="validUntil">বায়নার মেয়াদ (কত তারিখ পর্যন্ত)</label>
    <input id="validUntil" type="date">

    <label for="details">অতিরিক্ত তথ্য (না দিলেও চলবে)</label>
    <textarea id="details" maxlength="500"></textarea>

    <button id="submitBtn">জমা দিন</button>
  </div>

  <div class="box" id="listBox">
    <h2>আমার জমা দেওয়া বায়না</h2>
    <div id="mine">লোড হচ্ছে...</div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const token = sessionStorage.getItem('token');
const user = JSON.parse(sessionStorage.getItem('user') || 'null');
const statusNames = { PENDING: 'যাচাইয়ের অপেক্ষায়', APPROVED: 'অনুমোদিত', REJECTED: 'বাতিল' };
const errorNames = {
  'Land not found': 'এই চারটা তথ্য দিয়ে কোনো জমি পাওয়া যায়নি। মৌজা, জরিপ, দাগ ও খতিয়ান নম্বর মিলিয়ে দেখুন।',
  'Bayna is not allowed on this land': 'এই জমিতে বায়না দেওয়া যায় না, কারণ এটা সরকারি খাস জমি বা অধিগ্রহণের আওতায় আছে।',
  'This bayna is already submitted': 'এই জমিতে এই বায়নানামার নম্বর আগেই জমা দেওয়া হয়েছে।',
  'Agreement number is required': 'বায়নানামার নম্বর দিন।',
  'Seller name is required': 'বিক্রেতার নাম দিন।',
  'Amount is not valid': 'টাকার পরিমাণ একটা পূর্ণ সংখ্যা হতে হবে, শূন্যের বেশি।',
  'Bayna date is not valid': 'বায়নার তারিখ ঠিক নেই (ভবিষ্যতের তারিখ হবে না)।',
  'Valid-until date is not valid': 'মেয়াদের তারিখ ঠিক নেই (বায়নার তারিখের আগে হবে না)।',
  'Details are too long': 'অতিরিক্ত তথ্য ৫০০ অক্ষরের বেশি হবে না।',
  'Land details are required': 'জমির চারটা তথ্যই দিতে হবে।',
  'Invalid or expired token': 'লগইনের মেয়াদ শেষ। আবার লগইন করুন।',
  'Not allowed': 'এই কাজের অনুমতি শুধু ইউজারদের আছে।'
};

function showMessage(text, isError) {
  const m = $('message');
  m.textContent = '';
  if (!text) return;
  const d = document.createElement('div');
  d.className = 'msg ' + (isError ? 'err' : 'ok');
  d.textContent = text;
  m.appendChild(d);
}

function addRow(parent, label, value) {
  const row = document.createElement('div');
  row.className = 'row';
  const a = document.createElement('span'); a.textContent = label;
  const b = document.createElement('span'); b.textContent = value || '-';
  row.append(a, b);
  parent.appendChild(row);
}

async function loadMouzas() {
  const sel = $('mouza');
  try {
    const res = await fetch('/api/mouzas');
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    sel.textContent = '';
    const first = document.createElement('option');
    first.value = ''; first.textContent = 'মৌজা বেছে নিন';
    sel.appendChild(first);
    data.mouzas.forEach(m => {
      const o = document.createElement('option');
      o.value = m.mouza_id;
      o.textContent = m.mouza_name + ' (' + m.upazila + ', ' + m.district + ' | জেএল ' + m.jl_number + ')';
      sel.appendChild(o);
    });
  } catch (e) {
    sel.textContent = '';
    const o = document.createElement('option');
    o.value = ''; o.textContent = 'মৌজার তালিকা আনা যায়নি';
    sel.appendChild(o);
  }
}

async function loadMine() {
  const box = $('mine');
  try {
    const res = await fetch('/api/user/my-bayna', { headers: { Authorization: 'Bearer ' + token } });
    const data = await res.json();
    if (!data.ok) { box.textContent = 'তালিকা আনা যায়নি।'; return; }
    box.textContent = '';
    if (data.submissions.length === 0) { box.textContent = 'এখনো কোনো বায়না জমা দেননি।'; return; }
    data.submissions.forEach(s => {
      const card = document.createElement('div');
      card.style.cssText = 'border:1px solid #dfe9e2;border-radius:8px;padding:10px;margin-bottom:10px;';
      addRow(card, 'বায়নানামার নম্বর', s.reference_number);
      addRow(card, 'জমি', s.mouza_name + ' | ' + s.survey_type + ' | ' + s.dag_number);
      addRow(card, 'তারিখ', String(s.record_date).slice(0, 10));
      addRow(card, 'অবস্থা', statusNames[s.review_status] || s.review_status);
      box.appendChild(card);
    });
  } catch (e) {
    box.textContent = 'সার্ভারের সাথে যোগাযোগ করা যায়নি।';
  }
}

$('submitBtn').addEventListener('click', async () => {
  const body = {
    mouza_id: $('mouza').value,
    survey_type: $('survey').value,
    dag: $('dag').value.trim(),
    khatian: $('khatian').value.trim(),
    agreement_number: $('agreement').value.trim(),
    seller_name: $('seller').value.trim(),
    amount: $('amount').value,
    bayna_date: $('baynaDate').value,
    valid_until: $('validUntil').value,
    details: $('details').value.trim()
  };
  if (!body.mouza_id || !body.survey_type || !body.dag || !body.khatian) {
    return showMessage('জমির চারটা তথ্যই দিন।', true);
  }
  if (!body.agreement_number || !body.seller_name || !body.amount || !body.bayna_date || !body.valid_until) {
    return showMessage('বায়নার সব ঘর পূরণ করুন (অতিরিক্ত তথ্য বাদে)।', true);
  }
  try {
    const res = await fetch('/api/user/submit-bayna', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!data.ok) return showMessage(errorNames[data.error] || ('জমা হয়নি: ' + data.error), true);
    showMessage('বায়না জমা হয়েছে। অ্যাডমিন যাচাই করার পর এটা জমির তথ্যে দেখা যাবে।', false);
    ['dag', 'khatian', 'agreement', 'seller', 'amount', 'baynaDate', 'validUntil', 'details'].forEach(id => { $(id).value = ''; });
    loadMine();
  } catch (e) {
    showMessage('সার্ভারের সাথে যোগাযোগ করা যায়নি।', true);
  }
});

if (!token || !user || user.role !== 'USER') {
  $('formBox').style.display = 'none';
  $('listBox').style.display = 'none';
  showMessage('এই পেজ দেখতে ইউজার হিসেবে লগইন করতে হবে।', true);
} else {
  $('baynaDate').max = new Date().toISOString().slice(0, 10);
  loadMouzas();
  loadMine();
}
</script>
<script src="/i18n.js"></script>
<script src="/site.js"></script>
</body>
</html>
